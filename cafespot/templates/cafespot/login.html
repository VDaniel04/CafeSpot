{% extends 'cafespot/base.html' %}

{% block content %}
    <h2>Autentificare</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Intră în cont</button>
    </form>
    <p>Nu ai cont? <a href="{% url 'register' %}">Înregistrează-te aici</a>.</p>
{% endblock %}
